<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Namasha Battle — Final Edition</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%230b0d14'/><path d='M16 4 L26 26 H6 Z' fill='%23ff5a2b'/></svg>">
<style>
:root{
--bg:#05060a; --panel:#10131d; --panel2:#171c2a; --line:#2a3347;
--fire:#ff5a2b; --gold:#ffcf5c; --volt:#41d9ff; --ember:#ff9a4d;
--ink:#eef1f7; --dim:#8b93a7;
--fd:Impact,'Arial Black','Franklin Gothic Bold',sans-serif;
--fb:'Segoe UI',Tahoma,'Trebuchet MS',Verdana,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;touch-action:none;overscroll-behavior:none;-webkit-touch-callout:none}
body{background:var(--bg);overflow:hidden;font-family:var(--fb);color:var(--ink);
display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none}
input{user-select:text;-webkit-user-select:text;touch-action:manipulation}
button,.card{touch-action:manipulation}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:5;opacity:.5;
background:radial-gradient(ellipse at 50% 45%,transparent 62%,rgba(0,0,0,.55) 100%)}
#stage{position:relative;box-shadow:0 0 90px rgba(255,90,43,.10),0 0 30px rgba(0,0,0,.8);touch-action:none}
canvas{display:block;background:#000;touch-action:none}
#ui{position:absolute;left:0;top:0;width:960px;height:540px;transform-origin:0 0;pointer-events:none;overflow:hidden}
.screen{position:absolute;inset:0;opacity:0;visibility:hidden;pointer-events:none;
transition:opacity .35s ease,transform .35s ease,visibility 0s linear .35s;transform:translateY(14px)}
.screen.active{opacity:1;visibility:visible;pointer-events:auto;transform:none;
transition:opacity .35s ease,transform .35s ease,visibility 0s}
kbd{display:inline-block;min-width:22px;text-align:center;padding:2px 6px;background:#1c2333;
border:1px solid #38445e;border-bottom-width:3px;border-radius:4px;font:600 11px var(--fb);color:#dbe4ff;direction:ltr}
.tag{font:700 10px/1 var(--fb);letter-spacing:.22em;color:var(--dim);text-transform:uppercase}
.btn{display:block;width:100%;text-align:left;padding:10px 18px;margin:7px 0;background:transparent;
border:2px solid var(--line);color:#cfd6e4;font:700 15px/1.2 var(--fb);letter-spacing:.14em;
text-transform:uppercase;cursor:pointer;transform:skewX(-8deg);transition:all .15s}
.btn>span{display:inline-block;transform:skewX(8deg)}
.btn:hover,.btn.focus{border-color:var(--fire);color:#fff;background:rgba(255,90,43,.12);
box-shadow:0 0 18px rgba(255,90,43,.35);transform:skewX(-8deg) translateX(5px)}
.btn:active{transform:skewX(-8deg) translateX(5px) scale(.98)}
.btn.small{width:auto;display:inline-block;margin:8px 10px 0 0;padding:8px 22px}
.rtl .btn{text-align:right}
#scr-title{background:linear-gradient(100deg,rgba(5,6,10,.93) 0%,rgba(5,6,10,.72) 42%,rgba(5,6,10,.15) 75%,transparent 100%)}
.rtl #scr-title{background:linear-gradient(-100deg,rgba(5,6,10,.93) 0%,rgba(5,6,10,.72) 42%,rgba(5,6,10,.15) 75%,transparent 100%)}
.t-inner{position:absolute;left:58px;top:52px;width:460px}
.rtl .t-inner{left:auto;right:58px;text-align:right}
.t-logo{font-family:var(--fd);font-size:74px;line-height:.84;letter-spacing:.02em;transform:skewX(-6deg);
color:#fff;text-shadow:4px 4px 0 var(--fire),8px 8px 0 rgba(255,90,43,.28),0 0 42px rgba(255,90,43,.45)}
.t-logo em{font-style:normal;color:var(--gold);text-shadow:4px 4px 0 #a1240f,0 0 34px rgba(255,207,92,.5)}
.t-sub{margin:16px 0 18px;font:700 14px var(--fb);letter-spacing:.1em;color:var(--ember)}
.t-menu{margin-top:6px;width:330px}
.rtl .t-menu{margin-left:auto;margin-right:0}
#scr-difficulty{display:flex;align-items:center;justify-content:center;background:rgba(5,6,10,.82)}
.d-box{width:440px;padding:28px 34px;background:var(--panel);border:1px solid var(--line);
box-shadow:0 20px 60px rgba(0,0,0,.6);transform:skewX(-3deg)}
.d-box>*{transform:skewX(3deg)}
.d-box h2{font-family:var(--fd);font-size:32px;letter-spacing:.06em;color:var(--gold);margin-bottom:4px}
.d-box p{color:var(--dim);font-size:12px;letter-spacing:.06em;margin-bottom:14px}
.diff .btn small{float:right;color:var(--dim);letter-spacing:.05em;font-weight:600}
.rtl .diff .btn small{float:left}
.diff .btn:hover small,.diff .btn.focus small{color:#ffd9a0}
#scr-select,#scr-stage{background:rgba(5,6,10,.88);display:flex;flex-direction:column;align-items:center;padding-top:12px}
.sel-top{display:flex;align-items:baseline;gap:16px}
.sel-head{font-family:var(--fd);font-size:26px;letter-spacing:.1em;color:#fff;text-shadow:3px 3px 0 rgba(255,90,43,.5)}
.sel-mode{font:700 10px var(--fb);letter-spacing:.22em;color:var(--dim)}
.sel-turn{font-family:var(--fd);font-size:22px;letter-spacing:.06em;margin-top:5px;transition:color .2s}
.sel-turn.t1{color:var(--gold);text-shadow:0 0 18px rgba(255,207,92,.45)}
.sel-turn.t2{color:var(--volt);text-shadow:0 0 18px rgba(65,217,255,.45)}
.steps{display:flex;gap:8px;margin-top:5px}
.steps span{padding:3px 12px;border:1px solid var(--line);font:700 9px var(--fb);letter-spacing:.18em;color:#5d6579;transform:skewX(-10deg);transition:all .2s}
.steps span.on{color:#fff;border-color:var(--fire);background:rgba(255,90,43,.16);box-shadow:0 0 12px rgba(255,90,43,.3)}
.steps span.done{color:#9aa3b5;border-color:#3a4457;background:rgba(255,255,255,.04)}
.sel-row{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;width:920px;margin-top:10px}
.card{position:relative;width:213px;padding:8px 10px 10px;background:var(--panel);
border:2px solid var(--line);cursor:pointer;transition:border-color .15s,box-shadow .15s;
clip-path:polygon(0 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%)}
.card.curP1{border-color:var(--gold);box-shadow:0 0 26px rgba(255,207,92,.4)}
.card.curP2{border-color:var(--volt);box-shadow:0 0 26px rgba(65,217,255,.4)}
.card.locked1{border-color:var(--gold)}
.card.locked2{border-color:var(--volt)}
.card canvas{display:block;width:189px;height:118px;background:linear-gradient(180deg,#141a29,#0b0e17);
border:1px solid #232c40;margin-bottom:5px}
.c-name{font-family:var(--fd);font-size:16px;letter-spacing:.05em;line-height:1;text-align:center}
#stage-row{width:956px}
#stage-row .card{width:180px}
#stage-row .card canvas{width:164px;height:102px}
.sel-tag{position:absolute;top:6px;left:6px;padding:2px 8px;font:800 9px var(--fb);letter-spacing:.14em;
transform:skewX(-10deg);opacity:0;transition:opacity .15s;z-index:2}
.sel-tag.a1{background:var(--gold);color:#231a02;opacity:1}
.sel-tag.a2{background:var(--volt);color:#02202b;opacity:1}
.stamp{position:absolute;top:8px;right:6px;padding:3px 8px;font:800 9px var(--fb);letter-spacing:.1em;
transform:rotate(6deg);opacity:0;transition:opacity .2s;z-index:2;border:2px solid;background:rgba(0,0,0,.4)}
.stamp.s2{top:36px}
.stamp.s1{color:var(--gold);border-color:var(--gold)}
.stamp.s2{color:var(--volt);border-color:var(--volt)}
.stamp.show{opacity:1}
.sel-ctrl{margin-top:8px;min-height:20px;font-size:12px;color:#b7bfd2;letter-spacing:.08em;text-align:center}
.sel-foot{margin-top:2px}
#splash{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;
background:rgba(4,5,9,.78);z-index:30}
#splash.show{display:flex}
.sp-vs{font-family:var(--fd);font-size:150px;font-style:italic;line-height:.8;color:var(--gold);
text-shadow:6px 6px 0 rgba(255,59,48,.55),0 0 60px rgba(255,207,92,.5);animation:vsPop .5s ease-out}
.sp-names{display:flex;gap:30px;align-items:center;font-family:var(--fd);font-size:40px;letter-spacing:.05em}
.sp-names .a{color:#ffb37a;text-shadow:3px 3px 0 #7a1d0a}
.sp-names .b{color:#9be9ff;text-shadow:3px 3px 0 #0a4a5e}
.sp-rounds{margin-top:14px;font:700 12px var(--fb);letter-spacing:.3em;color:var(--dim)}
@keyframes vsPop{0%{transform:scale(2.4);opacity:0}60%{transform:scale(.92);opacity:1}100%{transform:scale(1)}}
#scr-results,#scr-pause{display:flex;align-items:center;justify-content:center;background:rgba(4,5,9,.72)}
.panel{width:470px;padding:30px 36px;background:var(--panel);border:1px solid var(--line);
box-shadow:0 24px 70px rgba(0,0,0,.65);transform:skewX(-3deg);backdrop-filter:blur(4px)}
.panel>*{transform:skewX(3deg)}
.panel h2{font-family:var(--fd);font-size:46px;letter-spacing:.04em;line-height:1}
.panel .sub{font:700 11px var(--fb);letter-spacing:.2em;color:var(--dim);margin:6px 0 14px}
.r-stats{display:flex;gap:14px;margin-bottom:8px}
.r-col{flex:1;background:var(--panel2);border:1px solid var(--line);padding:10px 14px}
.r-col h3{font-family:var(--fd);font-size:18px;letter-spacing:.05em}
.r-col p{font-size:11px;color:var(--dim);margin-top:4px;letter-spacing:.05em}
.r-col p b{color:var(--ink);font-size:14px}
#scr-help{background:rgba(5,6,10,.92);display:flex;align-items:center;justify-content:center}
.h-box{width:800px;max-height:520px;overflow:hidden;padding:20px 30px;background:var(--panel);border:1px solid var(--line)}
.h-box h2{font-family:var(--fd);font-size:30px;letter-spacing:.06em;color:var(--gold);margin-bottom:10px}
.h-grid{display:flex;gap:18px}
.h-col{flex:1;background:var(--panel2);border:1px solid var(--line);padding:12px 14px}
.h-col h3{font-family:var(--fd);font-size:17px;letter-spacing:.06em;margin-bottom:6px}
.h-col.p1 h3{color:var(--gold)} .h-col.p2 h3{color:var(--volt)}
.h-col table{width:100%;border-collapse:collapse;font-size:11px}
.h-col td{padding:3px 0;color:#b7bfd2;letter-spacing:.02em}
.h-col td:first-child{width:112px}
.h-rules{margin-top:10px;font-size:11px;line-height:1.7;color:#aeb6c8;letter-spacing:.02em}
.h-rules b{color:var(--gold)}
.h-rules .u{color:var(--volt);font-weight:700}
.rtl .h-box,.rtl .h-col,.rtl .h-rules{text-align:right}

#scr-online{display:flex;align-items:center;justify-content:center;background:rgba(5,6,10,.86)}
.on-box{width:500px;padding:24px 32px;background:var(--panel);border:1px solid var(--line);
box-shadow:0 22px 65px rgba(0,0,0,.68);transform:skewX(-3deg)}
.on-box>*{transform:skewX(3deg)}
.on-box h2{font-family:var(--fd);font-size:32px;letter-spacing:.06em;color:var(--volt);margin-bottom:4px}
.on-box p.on-sub{color:var(--dim);font-size:12px;letter-spacing:.05em;margin-bottom:14px}
.on-status{display:flex;align-items:center;gap:8px;font-size:11px;color:#aeb6c8;margin-bottom:12px;
padding:6px 10px;background:var(--panel2);border:1px solid var(--line)}
.on-dot{width:8px;height:8px;border-radius:50%;background:#e04838;flex-shrink:0}
.on-dot.ok{background:#3fe08f;box-shadow:0 0 8px rgba(63,224,143,.7)}
.on-dot.wait{background:#ffcf5c;box-shadow:0 0 8px rgba(255,207,92,.7)}
.on-room{background:var(--panel2);border:1px solid var(--volt);padding:14px;margin:10px 0;text-align:center}
.on-room .r-lbl{font:700 10px var(--fb);letter-spacing:.18em;color:var(--dim);margin-bottom:6px}
.on-code-row{display:flex;align-items:center;justify-content:center;gap:12px}
.on-code{font-family:var(--fd);font-size:38px;letter-spacing:.18em;color:var(--gold);
text-shadow:0 0 18px rgba(255,207,92,.45);direction:ltr;user-select:all}
.on-copy{padding:6px 14px;background:rgba(65,217,255,.14);border:1px solid var(--volt);color:#fff;
font:700 11px var(--fb);letter-spacing:.12em;cursor:pointer;text-transform:uppercase;transition:all .15s}
.on-copy:hover{background:rgba(65,217,255,.28)}
.on-wait{margin-top:8px;font-size:12px;color:var(--volt);letter-spacing:.06em;animation:pulseTxt 1.4s infinite}
@keyframes pulseTxt{0%,100%{opacity:1}50%{opacity:.45}}
.on-div{text-align:center;font:700 10px var(--fb);letter-spacing:.2em;color:#5e677d;margin:12px 0}
.on-join{display:flex;gap:10px;align-items:stretch}
.on-inp{flex:1;background:#0b0e16;border:2px solid var(--line);color:#fff;padding:9px 14px;
font-family:var(--fd);font-size:22px;letter-spacing:.2em;text-align:center;text-transform:uppercase;
outline:none;direction:ltr;transition:border-color .15s}
.on-inp:focus{border-color:var(--volt)}
.on-inp::placeholder{font-family:var(--fb);font-size:12px;letter-spacing:.1em;color:#555e73}
.on-join .btn{width:auto;margin:0;padding:10px 20px;white-space:nowrap}
.on-err{min-height:18px;margin-top:8px;font-size:12px;color:#ff6b5b;text-align:center}
.on-srv-row{display:flex;gap:6px;margin-top:10px;align-items:center}
.on-srv-inp{flex:1;background:#0b0e16;border:1px solid var(--line);color:#9aa3b5;padding:5px 8px;
font:11px monospace;outline:none;direction:ltr}
.on-srv-inp:focus{border-color:var(--volt);color:#fff}
.on-srv-btn{padding:5px 10px;background:var(--panel2);border:1px solid var(--line);color:#cfd6e4;
font:700 10px var(--fb);cursor:pointer;letter-spacing:.08em}
.on-srv-btn:hover{border-color:var(--volt);color:#fff}
.rtl .on-box{text-align:right}
#toast{position:absolute;top:16px;left:50%;transform:translateX(-50%) translateY(-20px);
padding:8px 20px;background:rgba(16,19,29,.95);border:1px solid var(--fire);color:#fff;
font:700 12px var(--fb);letter-spacing:.08em;opacity:0;pointer-events:none;z-index:50;
transition:opacity .25s,transform .25s;box-shadow:0 8px 24px rgba(0,0,0,.6)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ================= ANDROID / MOBILE VIRTUAL CONTROLLER ================= */
#touch-controls{position:fixed;inset:0;pointer-events:none;z-index:25;display:none;direction:ltr}
#touch-controls.active{display:block}
.tc-pause{position:fixed;top:max(6px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);
pointer-events:auto;padding:5px 14px;border-radius:16px;background:rgba(16,19,29,.72);
border:1px solid rgba(255,255,255,.28);color:#eef1f7;font:800 11px var(--fb);letter-spacing:.12em;
backdrop-filter:blur(4px);box-shadow:0 4px 12px rgba(0,0,0,.45)}
.tc-pause:active{background:rgba(255,90,43,.45);border-color:var(--fire)}
.tc-stick{position:fixed;left:max(14px,env(safe-area-inset-left));bottom:max(14px,env(safe-area-inset-bottom));
width:132px;height:132px;border-radius:50%;pointer-events:auto;touch-action:none;
background:radial-gradient(circle,rgba(255,255,255,.07) 0%,rgba(16,19,29,.62) 72%,rgba(255,255,255,.14) 100%);
border:2px solid rgba(255,255,255,.22);box-shadow:0 6px 24px rgba(0,0,0,.55)}
.tc-stick-dir{position:absolute;font:900 11px var(--fb);color:rgba(255,255,255,.36);pointer-events:none}
.tc-stick-dir.u{top:7px;left:50%;transform:translateX(-50%)}
.tc-stick-dir.d{bottom:7px;left:50%;transform:translateX(-50%)}
.tc-stick-dir.l{left:9px;top:50%;transform:translateY(-50%)}
.tc-stick-dir.r{right:9px;top:50%;transform:translateY(-50%)}
.tc-knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;
background:radial-gradient(circle at 35% 35%,rgba(255,255,255,.42),rgba(130,145,175,.28));
border:2px solid rgba(255,255,255,.55);box-shadow:0 4px 14px rgba(0,0,0,.6);pointer-events:none;
transition:transform .04s linear}
.tc-actions{position:fixed;right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));
width:206px;height:152px;pointer-events:auto;touch-action:none}
.tc-btn{position:absolute;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;
background:rgba(16,19,29,.68);border:2px solid rgba(255,255,255,.28);color:#fff;
box-shadow:0 4px 16px rgba(0,0,0,.55);transition:transform .06s,background .08s,border-color .08s;pointer-events:auto}
.tc-btn b{font:900 15px/1 var(--fd);letter-spacing:.04em;pointer-events:none}
.tc-btn small{font:700 8px/1 var(--fb);opacity:.78;margin-top:2px;pointer-events:none}
.tc-btn.pressed{transform:scale(.9);background:rgba(255,90,43,.45);border-color:var(--fire);box-shadow:0 0 18px rgba(255,90,43,.65)}
#tc-L{width:52px;height:52px;left:56px;bottom:4px}
#tc-M{width:52px;height:52px;left:12px;bottom:46px}
#tc-H{width:54px;height:54px;left:58px;bottom:92px;border-color:rgba(255,154,77,.45)}
#tc-blk{width:56px;height:56px;right:4px;bottom:4px;border-color:rgba(65,217,255,.45);color:#bdf2ff}
#tc-blk.pressed{background:rgba(65,217,255,.42);border-color:var(--volt);box-shadow:0 0 18px rgba(65,217,255,.65)}
#tc-fire{width:52px;height:52px;right:12px;bottom:68px;border-color:rgba(255,154,77,.35);opacity:.65}
#tc-fire.ready{opacity:1;border-color:var(--ember);box-shadow:0 0 14px rgba(255,154,77,.45)}
#tc-ult{width:56px;height:56px;right:74px;bottom:46px;border-color:rgba(255,207,92,.35);opacity:.58}
#tc-ult.ready{opacity:1;border-color:var(--gold);background:rgba(255,160,30,.28);color:var(--gold);
box-shadow:0 0 22px rgba(255,207,92,.75);animation:ultPulse 1s infinite}
@keyframes ultPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

#rotate-tip{position:fixed;inset:0;z-index:80;background:rgba(5,6,10,.92);display:none;
flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;backdrop-filter:blur(6px)}
#rotate-tip.show{display:flex}
.rt-icon{font-size:48px;margin-bottom:12px;animation:rotAnim 1.8s ease-in-out infinite}
@keyframes rotAnim{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-90deg)}}
.rt-msg{font:700 15px/1.6 var(--fb);color:#eef1f7;max-width:300px;margin-bottom:16px}
.rt-btn{padding:8px 20px;background:var(--panel2);border:1px solid var(--line);color:#aeb6c8;
font:700 12px var(--fb);border-radius:6px;cursor:pointer}
</style>
</head>
<body>
<div id="stage">
<canvas id="cv"></canvas>
<div id="ui">
<section id="scr-title" class="screen active">
<div class="t-inner">
<div class="t-logo">NAMASHA<br><em>BATTLE</em></div>
<div class="t-sub" id="t-sub"></div>
<nav class="t-menu">
<button class="btn" data-act="vs-cpu" id="btn-cpu"><span></span></button>
<button class="btn" data-act="vs-2p" id="btn-2p"><span></span></button>
<button class="btn" data-act="vs-online" id="btn-online"><span></span></button>
<button class="btn" data-act="help" id="btn-help"><span></span></button>
<button class="btn" data-act="sound" id="btn-sound"><span></span></button>
<button class="btn" data-act="lang" id="btn-lang"><span></span></button>
</nav>
</div>
</section>
<section id="scr-online" class="screen">
<div class="on-box">
<h2 id="on-title"></h2>
<p class="on-sub" id="on-sub"></p>
<div class="on-status"><span class="on-dot" id="on-dot"></span><span id="on-st-txt"></span></div>
<button class="btn" data-act="on-create" id="btn-on-create"><span></span></button>
<div class="on-room" id="on-room-box" style="display:none">
<div class="r-lbl" id="on-code-lbl"></div>
<div class="on-code-row">
<span class="on-code" id="on-code-val">-----</span>
<button class="on-copy" data-act="on-copy" id="btn-on-copy"></button>
</div>
<div class="on-wait" id="on-wait-txt"></div>
</div>
<div id="on-join-wrap">
<div class="on-div" id="on-or">OR</div>
<div class="on-join">
<input class="on-inp" id="on-code-inp" maxlength="6" autocomplete="off" spellcheck="false">
<button class="btn" data-act="on-join" id="btn-on-join"><span></span></button>
</div>
</div>
<div class="on-err" id="on-err"></div>
<div class="on-srv-row">
<input class="on-srv-inp" id="on-srv-inp" placeholder="ws://localhost:8080">
<button class="on-srv-btn" data-act="on-reconnect" id="btn-on-reconn"></button>
</div>
<button class="btn small" data-act="back"><span class="lbl-back"></span></button>
</div>
</section>
<div id="toast"></div>
<section id="scr-difficulty" class="screen">
<div class="d-box">
<h2 id="d-title"></h2>
<p id="d-sub"></p>
<div class="diff">
<button class="btn" data-act="diff-easy" id="btn-de"><span></span><small id="s-de"></small></button>
<button class="btn" data-act="diff-normal" id="btn-dn"><span></span><small id="s-dn"></small></button>
<button class="btn" data-act="diff-hard" id="btn-dh"><span></span><small id="s-dh"></small></button>

<button class="btn small" data-act="back"><span class="lbl-back"></span></button>
</div>
</section>
<section id="scr-select" class="screen">
<div class="sel-top">
<div class="sel-head" id="sel-head"></div>
<div class="sel-mode" id="sel-mode"></div>
</div>
<div class="sel-turn t1" id="sel-turn"></div>

</section>
<section id="scr-stage" class="screen">

</div>
<div class="sel-turn t1" id="stage-turn"></div>
<div class="sel-row" id="stage-row"></div>
<div class="sel-ctrl" id="stage-ctrl"></div>
<div class="sel-foot">
<button class="btn small" data-act="back"><span class="lbl-back"></span></button>
</div>
</section>
<section id="scr-help" class="screen">
<div class="h-box" id="h-box"></div>
</section>
<section id="scr-results" class="screen">
<div class="panel">
<h2 id="res-title"></h2>
<div class="sub" id="res-sub"></div>
<div class="r-stats">
<div class="r-col"><h3 id="r1-name"></h3>

<div class="r-col"><h3 id="r2-name"></h3>

<p><span id="lbl-dmg2"></span> <b id="r2-dmg">0</b></p></div>
</div>
<button class="btn small" data-act="rematch" id="btn-rematch"><span></span></button>
<button class="btn small" data-act="charsel" id="btn-chars"><span></span></button>
<button class="btn small" data-act="title" id="btn-menu"><span></span></button>
</div>
</section>
<section id="scr-pause" class="screen">
<div class="panel">
<h2 style="color:var(--gold)" id="pause-title"></h2>
<div class="sub" id="pause-sub"></div>
<button class="btn" data-act="resume" id="btn-resume"><span></span></button>
<button class="btn" data-act="restart" id="btn-restart"><span></span></button>
<button class="btn" data-act="title" id="btn-quit"><span></span></button>
</div>
</section>
</div>
</div>

function ikSolve(rx,ry,tx,ty,l1,l2,dir){
let dx=tx-rx,dy=ty-ry,d=Math.hypot(dx,dy);

if(d>maxD){dx*=maxD/d;dy*=maxD/d;tx=rx+dx;ty=ry+dy;d=maxD;}
if(d<minD)d=minD;
const ang=Math.atan2(dy,dx);
const cos=clamp((l1*l1+d*d-l2*l2)/(2*l1*d),-1,1);
const b=Math.acos(cos)*dir;
return [rx+Math.cos(ang+b)*l1, ry+Math.sin(ang+b)*l1, tx, ty];
}

const ay=tr.type==='hair'?this.anchHY:this.anchCY;

for(let i=0;i<this.trail.length;i++){
const p=this.trail[i];
if(i===0){p.x=ax;p.y=ay;p.ox=ax;p.oy=ay;prev=p;continue;}
const vx=(p.x-p.ox)*0.82+wind*0.5, vy=(p.y-p.oy)*0.82+0.55;
p.ox=p.x;p.oy=p.y;p.x+=vx;p.y+=vy;
const dx=p.x-prev.x,dy=p.y-prev.y,d=Math.hypot(dx,dy)||1;
const k=this.segLen/d;
p.x=prev.x+dx*k;p.y=prev.y+dy*k;
prev=p;
}
}

case 'sound':AudioSys.setMute(!AudioSys.muted);updateSoundLabel();break;
case 'lang':toggleLang();break;
case 'diff-easy':case 'diff-normal':case 'diff-hard':
AudioSys.play('select');UI.openSelect('cpu',btn.dataset.act.slice(5));break;
case 'back':
AudioSys.play('back');
if(scene==='online'){Net.leaveRoom(false);setScene('title');}
else if(scene==='select'&&UI.selState&&UI.selState.mode==='online'){Net.leaveRoom(false);UI.openOnlineLobby();}
else if(scene==='stage'&&UI.selState&&UI.selState.mode==='online'){Net.leaveRoom(false);UI.openOnlineLobby();}
else if(scene==='stage'&&UI.selState)UI.openSelect(UI.selState.mode,UI.selState.diff);
else setScene('title');
break;
case 'resume':game.setPause(false);break;
case 'restart':
game.setPause(false);
if(game.mode==='online'){
if(Net.role===0){
game.start('online','normal',game.p1.def,game.p2.def,game.stageKey);
Net.relay({t:'match_start',c1:game.p1.def.key,c2:game.p2.def.key,st:game.stageKey});
}else Net.relay({t:'rematch_req'});
}else game.start(game.mode,game.diff,game.p1.def,game.p2.def,game.stageKey);
break;
case 'rematch':
if(game.mode==='online'){
if(Net.role===0){
game.start('online','normal',game.p1.def,game.p2.def,game.stageKey);
Net.relay({t:'match_start',c1:game.p1.def.key,c2:game.p2.def.key,st:game.stageKey});
}else{
Net.relay({t:'rematch_req'});
showToast(I18N.t('onWait'));
}
}else game.start(game.mode,game.diff,game.p1.def,game.p2.def,game.stageKey);
break;
case 'charsel':
if(game.mode==='online'){
Net.relay({t:'charsel_req'});
UI.openOnlineSelect(Net.role,Net.code);
}else UI.openSelect(game.mode,game.diff);
break;
case 'title':
if(game.mode==='online'||Net.code)Net.leaveRoom(false);
UI.toTitle();break;
}
});
document.getElementById('ui').addEventListener('mouseover',e=>{
if(scene==='title'){
const btns=UI.titleBtns();
const t=e.target.closest('#scr-title .btn');
if(t){const idx=btns.indexOf(t);if(idx>=0&&UI.titleIdx!==idx){UI.titleIdx=idx;UI.refreshTitleFocus();}}
}
if(scene==='select'&&UI.selState){
const card=e.target.closest('#sel-row .card');
if(card){const cards=UI.cardEls();const idx=cards.indexOf(card);if(idx>=0)UI.hoverSel(idx);}
}
if(scene==='stage'&&UI.stageState){
const card=e.target.closest('#stage-row .card');
if(card){const cards=UI.stageCards();const idx=cards.indexOf(card);if(idx>=0)UI.hoverStage(idx);}
}
});
function uiKeys(){
if(scene==='title'){
const btns=UI.titleBtns();
if(Input.hit('KeyW')||Input.hit('ArrowUp')){UI.titleIdx=wrapIdx(UI.titleIdx-1,btns.length);AudioSys.play('move');UI.refreshTitleFocus();}
if(Input.hit('KeyS')||Input.hit('ArrowDown')){UI.titleIdx=wrapIdx(UI.titleIdx+1,btns.length);AudioSys.play('move');UI.refreshTitleFocus();}
if(Input.hit('KeyT')){toggleLang();UI.refreshTitleFocus();}
if(Input.hit('Enter')||Input.hit('KeyF')||Input.hit('Space')){if(btns[UI.titleIdx])btns[UI.titleIdx].click();}
}else if(scene==='online'){
if(Input.hit('Escape')){AudioSys.play('back');Net.leaveRoom(false);setScene('title');}
}else if(scene==='select'&&UI.selState){
const s=UI.selState;
if(Input.hit('Escape')){
AudioSys.play('back');
if(s.mode==='online'){Net.leaveRoom(false);UI.openOnlineLobby();}
else setScene('title');
return;
}
if(s.splash===0&&s.cpuPhase===0){
if(s.mode==='online'){
const meReady=s.myRole===0?s.p1Ready:s.p2Ready;
if(!meReady){
if(Input.hit('KeyA')||Input.hit('ArrowLeft'))UI.moveSel(s.myRole+1,-1);
if(Input.hit('KeyD')||Input.hit('ArrowRight'))UI.moveSel(s.myRole+1,1);
if(Input.hit('KeyF')||Input.hit('Enter')||Input.hit('Space'))UI.confirmSel(s.myRole+1);
}
}else if(s.turn===1&&!s.p1Ready){
if(Input.hit('KeyA'))UI.moveSel(1,-1);
if(Input.hit('KeyD'))UI.moveSel(1,1);
if(Input.hit('KeyF'))UI.confirmSel(1);
}else if(s.turn===2&&s.mode==='2p'&&!s.p2Ready){
if(Input.hit('ArrowLeft'))UI.moveSel(2,-1);
if(Input.hit('ArrowRight'))UI.moveSel(2,1);
if(Input.hit('KeyJ'))UI.confirmSel(2);
}
}
}else if(scene==='stage'&&UI.stageState){
const s=UI.stageState,cards=UI.stageCards(),n=cards.length||5;
const flip=I18N.lang==='fa'?-1:1;
const isGuestOnline=UI.selState&&UI.selState.mode==='online'&&Net.role===1;
if(!isGuestOnline){
if(Input.hit('KeyA')||Input.hit('ArrowLeft')){
s.cursor=wrapIdx(s.cursor-flip,n);AudioSys.play('move');UI.updateStageCards();
if(UI.selState&&UI.selState.mode==='online'&&Net.role===0)Net.relay({t:'stg_cur',c:s.cursor});
}
if(Input.hit('KeyD')||Input.hit('ArrowRight')){
s.cursor=wrapIdx(s.cursor+flip,n);AudioSys.play('move');UI.updateStageCards();
if(UI.selState&&UI.selState.mode==='online'&&Net.role===0)Net.relay({t:'stg_cur',c:s.cursor});
}
if(Input.hit('KeyF')||Input.hit('KeyJ')||Input.hit('Enter')){AudioSys.play('select');UI.confirmStage();}
}
if(Input.hit('Escape')){
AudioSys.play('back');
if(UI.selState&&UI.selState.mode==='online'){Net.leaveRoom(false);UI.openOnlineLobby();}
else if(UI.selState)UI.openSelect(UI.selState.mode,UI.selState.diff);
}
}else if(scene==='help'){
if(Input.hit('Escape')||Input.hit('Enter')){AudioSys.play('back');setScene('title');}
}else if(scene==='fight'){
if(Input.hit('Escape')||Input.hit('KeyP')){
if(game.phase!=='matchend'){game.setPause(!game.paused);AudioSys.play('select');}
}
if(game.phase==='matchend'&&game.resShown&&Input.hit('Enter')){
const b=document.querySelector('[data-act="rematch"]');if(b)b.click();
}
}
if(Input.hit('KeyM')){AudioSys.ensure();AudioSys.setMute(!AudioSys.muted);updateSoundLabel();}
}

// ============================================================================
// ANDROID / MOBILE MULTI-TOUCH CONTROLLER
// ============================================================================
const TouchCtrl={
enabled:false,
rotateDismissed:false,
stickId:null,
upHeld:false,
btnTouches:new Map(),
state:{left:false,right:false,down:false,up:false,L:false,M:false,H:false,fire:false,ult:false,block:false},
init(){
this.enabled=('ontouchstart' in window)||(navigator.maxTouchPoints>0)||
(window.matchMedia&&window.matchMedia('(pointer: coarse)').matches);
const stick=$('tc-stick'),knob=$('tc-knob'),actions=$('tc-actions'),pauseBtn=$('tc-pause');
const rtDis=$('rt-dismiss');
if(rtDis)rtDis.addEventListener('click',()=>{this.rotateDismissed=true;this.checkOrientation();});
window.addEventListener('touchstart',()=>{
if(!this.enabled){this.enabled=true;resize();this.syncVisibility();}
},{passive:true});
if(pauseBtn){
const doPause=e=>{
e.preventDefault();e.stopPropagation();
AudioSys.ensure();
if(scene==='fight'&&game.phase!=='matchend'){game.setPause(!game.paused);AudioSys.play('select');}
};
pauseBtn.addEventListener('touchstart',doPause,{passive:false});
pauseBtn.addEventListener('click',doPause);
}
if(stick&&knob){
const updateStick=(cx,cy)=>{
const r=stick.getBoundingClientRect();
const ox=r.left+r.width/2,oy=r.top+r.height/2;
const dx=cx-ox,dy=cy-oy,dist=Math.hypot(dx,dy),maxR=38;
const kx=dist>maxR?(dx/dist)*maxR:dx;
const ky=dist>maxR?(dy/dist)*maxR:dy;
knob.style.transform='translate('+kx.toFixed(1)+'px,'+ky.toFixed(1)+'px)';
if(dist<14){
this.state.left=false;this.state.right=false;this.state.down=false;this.upHeld=false;
return;
}
this.state.left=dx<-15;
this.state.right=dx>15;
const wantUp=dy<-24;
if(wantUp&&!this.upHeld)this.state.up=true;
this.upHeld=wantUp;
this.state.down=!wantUp&&dy>20;
};
const clearStick=()=>{
this.stickId=null;this.upHeld=false;
this.state.left=false;this.state.right=false;this.state.down=false;this.state.up=false;
knob.style.transform='translate(0px,0px)';
};
stick.addEventListener('touchstart',e=>{
e.preventDefault();AudioSys.ensure();
if(this.stickId===null&&e.changedTouches.length>0){
const t=e.changedTouches[0];
this.stickId=t.identifier;
updateStick(t.clientX,t.clientY);
}
},{passive:false});
stick.addEventListener('touchmove',e=>{
for(let i=0;i<e.changedTouches.length;i++){
const t=e.changedTouches[i];
if(t.identifier===this.stickId){e.preventDefault();updateStick(t.clientX,t.clientY);break;}
}
},{passive:false});
const onStickEnd=e=>{
for(let i=0;i<e.changedTouches.length;i++){
if(e.changedTouches[i].identifier===this.stickId){e.preventDefault();clearStick();break;}
}
};
stick.addEventListener('touchend',onStickEnd,{passive:false});
stick.addEventListener('touchcancel',onStickEnd,{passive:false});
}
if(actions){
const releaseTouch=id=>{
const info=this.btnTouches.get(id);
if(!info)return;
this.btnTouches.delete(id);
let stillHeld=false;
for(const v of this.btnTouches.values()){if(v.key===info.key){stillHeld=true;break;}}
if(!stillHeld){
info.el.classList.remove('pressed');
if(info.key==='block')this.state.block=false;
}
};
actions.addEventListener('touchstart',e=>{
e.preventDefault();AudioSys.ensure();
for(let i=0;i<e.changedTouches.length;i++){
const t=e.changedTouches[i];
const el=document.elementFromPoint(t.clientX,t.clientY);
const btn=el?el.closest('.tc-btn'):null;
if(!btn)continue;
const key=btn.dataset.tkey;
this.btnTouches.set(t.identifier,{key,el:btn});
btn.classList.add('pressed');
if(key==='block')this.state.block=true;
else this.state[key]=true;
}
},{passive:false});
const onActEnd=e=>{
e.preventDefault();
for(let i=0;i<e.changedTouches.length;i++)releaseTouch(e.changedTouches[i].identifier);
};
actions.addEventListener('touchend',onActEnd,{passive:false});
actions.addEventListener('touchcancel',onActEnd,{passive:false});
window.addEventListener('touchend',e=>{
for(let i=0;i<e.changedTouches.length;i++)releaseTouch(e.changedTouches[i].identifier);
},{passive:true});
}
this.checkOrientation();
this.syncVisibility();
},
reset(){
this.stickId=null;this.upHeld=false;
for(const v of this.btnTouches.values())v.el.classList.remove('pressed');
this.btnTouches.clear();
const knob=$('tc-knob');if(knob)knob.style.transform='translate(0px,0px)';
const s=this.state;
s.left=s.right=s.down=s.up=s.L=s.M=s.H=s.fire=s.ult=s.block=false;
},
endFrame(){
const s=this.state;
s.up=false;s.L=false;s.M=false;s.H=false;s.fire=false;s.ult=false;
},
syncVisibility(){
const el=$('touch-controls');if(!el)return;
const show=this.enabled&&scene==='fight'&&!game.paused&&game.phase!=='matchend'&&!game.cine;
el.classList.toggle('active',show);
if(!show)this.reset();
},
syncHUD(){
if(!this.enabled||scene!=='fight'||!game.p1)return;
const me=(game.mode==='online'&&Net.role===1)?game.p2:game.p1;
if(!me)return;
const fb=$('tc-fire'),ub=$('tc-ult');
if(fb)fb.classList.toggle('ready',me.meter>=FIRE_COST&&me.fireCd<=0);
if(ub)ub.classList.toggle('ready',me.meter>=MAX_METER);
},
checkOrientation(){
const tip=$('rotate-tip');if(!tip)return;
const portrait=this.enabled&&!this.rotateDismissed&&(window.innerHeight>window.innerWidth);
tip.classList.toggle('show',portrait);
}
};

const codeInpEl=$('on-code-inp');
if(codeInpEl)codeInpEl.addEventListener('keydown',e=>{if(e.key==='Enter')Net.joinRoom();});
Net.initUrl();
P.init();Projs.init();Floats.init();BG.init();UI.buildCards();applyI18n();UI.refreshTitleFocus();TouchCtrl.init();resize();
let last=performance.now(),acc=0,fatalLogged=false;
const STEP=1000/60;
function step(){
gt+=DT;
uiKeys();
if(scene==='select')UI.tick();
if(scene!=='fight'){demoA.animOnly();demoB.animOnly();}
spawnAmbient();
if(scene==='fight'&&!game.paused){
game.stepFight();
}
P.update();Floats.update();
if(scene==='fight'){
if(game.banner===null&&game.bannerQ.length)game.banner=Object.assign({t:0},game.bannerQ.shift());
if(game.banner&&++game.banner.t>=game.banner.dur)game.banner=null;
TouchCtrl.syncVisibility();
TouchCtrl.syncHUD();
}
Input.endFrame();
TouchCtrl.endFrame();
}
function frame(now){
requestAnimationFrame(frame);
let dt=now-last;last=now;
if(dt>250)dt=250;
if(scene==='fight'&&game.slowmoT>0){game.slowmoT-=dt;dt*=0.45;}
acc+=dt;
try{
while(acc>=STEP){acc-=STEP;step();}
}catch(err){
acc=0;Input.endFrame();TouchCtrl.endFrame();
if(!fatalLogged){fatalLogged=true;console.error('Namasha Battle step guard:',err);}
}
try{
if(scene==='select')drawPortraits();
render(now);
}catch(err){
if(!fatalLogged){fatalLogged=true;console.error('Namasha Battle render guard:',err);}
}
}
requestAnimationFrame(frame);
})();
</script>
